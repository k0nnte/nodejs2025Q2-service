services:
  postgres:
    image: postgres:17-alpine
    container_name: postgres
    restart: always
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '${DB_PORT}:5432'
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER"]  
      timeout: 10s
      interval: 1s
      retries: 10

  app:
    build: .
    container_name: app
    restart: always
    volumes:
      - ./src:/app/src
    env_file:
      - .env
    ports:
      - '${PORT}:${PORT}'
    networks:
      - app-network
    depends_on:
      postgres:
        condition: service_healthy
          
    

networks:
    app-network:
      driver: bridge


volumes:
  postgres_data:

